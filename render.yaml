services:
  - type: web
    name: fly-home-together
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: AERODATABOX_API_KEY
        sync: false
      - key: DB_PATH
        value: fht.db
